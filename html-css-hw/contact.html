<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="style.css">
<style>
    #coloring{
        text-decoration-color: red;
    }
</style>
</head>

<body>

        <header>
       
            <nav class="navigation">
            <a href="contact.html"> Contact us</a>
            <a href="about.html"> About me</a>
            <a href="table.html"> Table</a>
            <a href="index.html"> Index</a>
            </nav>
    
    </header>

    <h1> Contact Form</h1>
    <form>
        <fieldset>
            <legend> Personal Information</legend>
            <label for="fullname"> Full Name </label>
            <input type="text" name="Full-Name" id="full-name"><br />
            <br />
            <label for="email"> Email </label>
            <input type="email" name="email" id="email"> <br />
            <br />
            <label for="password"> Password </label>
            <input type="password" name="password" id="password"> <br />
            <br />
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </fieldset>

        <fieldset>
             <legend>Hobbies</legend>
        <input type="checkbox" id="reading" name="hobby" value="Reading">
        <label for="reading">Reading</label><br>

        <input type="checkbox" id="sports" name="hobby" value="Sports">
        <label for="sports">Sports</label><br>

        <input type="checkbox" id="gaming" name="hobby" value="Gaming">
        <label for="gaming">Gaming</label>
</fieldset>


        <fieldset>
            <legend>Address Details</legend>
            <label for="country"> Country: </label>
            
            <select name="country" id="country">
                <option value="" disabled selected style="color: gray;"> Select a country
                <optgroup label="Gulf Countries">Gulf Countries
                    <option value="Saudi Arabia">Saudi Arabia</option>
                    <option value="Oman">Oman</option>
                </optgroup>

                <optgroup label="Arab Countries">Gulf Countries
                    <option value="Jordan">Saudi Arabia</option>
                    <option value="Sudan">Sudan</option>
                </optgroup>
            </select><br />

            <lable for="City">City:</lable>
            <input list="cities" id="city" name="city">
            <datalist id="cities">
                <option value="Jeddah">
                <option value="Riyadh">
                <option value="Makkah">
            </datalist>
            <br />
        </fieldset>
        <fieldset>
            <legend>Message</legend>
            <label for="Message">Message</label>
            <textarea name="Message"></textarea>
            <br />
        </fieldset>



        <button type="submit" id="coloring"> Submit </button>
        <button type="reset"> Reset </button>


    </form>

</body>

</html>
